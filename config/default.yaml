# Pipeline Configuration — All tuneable values live here, NO hardcoding in source code

# ─── Input Data ───────────────────────────────────────────────────────────────
data:
  depth_scale_factor: 0.001      # Converts raw depth PNG integer values to metres (÷1000)
  depth_max_meters: 10.0         # Discard depth readings beyond this distance
  depth_min_meters: 0.1          # Discard depth readings closer than this
  confidence_threshold: 1        # Minimum LiDAR confidence level to keep (0=low, 1=med, 2=high)

# ─── Camera & Backprojection ──────────────────────────────────────────────────
camera:
  # Overridden at runtime from camera_matrix.csv / odometry.csv
  # These are fallback defaults only
  fx: 1596.0
  fy: 1596.0
  cx: 955.0
  cy: 717.0

# ─── Point Cloud ──────────────────────────────────────────────────────────────
point_cloud:
  voxel_size: 0.02               # Voxel downsampling grid size in metres (2 cm)
  frame_stride: 5                # Process every Nth frame (1 = all frames, higher = faster)
  icp_max_correspondence: 0.05   # Max ICP point-pair distance in metres

# ─── Plane Detection (RANSAC) ─────────────────────────────────────────────────
plane_detection:
  distance_threshold: 0.02       # Max point-to-plane distance to be an inlier (metres)
  ransac_n: 3                    # Min points to define a plane
  num_iterations: 1000           # RANSAC iterations
  min_inlier_ratio: 0.01         # Lowered: iOS LiDAR walls have fewer points than floor
  max_planes: 15                 # Detect up to 15 planes (floor + ceiling + 4+ walls)

# ─── Floor Plan Extraction ────────────────────────────────────────────────────
floor_plan:
  wall_height_band_min: 0.1      # Min z offset from floor to sample wall points (metres)
  wall_height_band_max: 1.8      # Max z offset from floor to sample wall points
  occupancy_grid_resolution: 0.02 # 2D grid cell size in metres
  wall_thickness_threshold: 0.15  # Max wall thickness to consider solid wall
  min_wall_length: 0.3            # Ignore wall segments shorter than this (metres)
  min_opening_width: 0.5          # Minimum door/window width (metres)
  max_opening_width: 3.0          # Maximum door/window width (metres)
  ceiling_sample_percentile: 95   # Use Nth percentile of z-values as ceiling height

# ─── Multi-Room Stitching ─────────────────────────────────────────────────────
stitching:
  overlap_threshold: 0.3         # Min overlap fraction to declare two scans adjacent
  icp_convergence_rmse: 0.001    # ICP convergence criterion

# ─── Damage Detection ─────────────────────────────────────────────────────────
damage:
  model_name: "yolov8n.pt"       # YOLO model variant (yolov8n/s/m/l/x)
  model_path: "./models/damage_detector.pt"  # Fine-tuned weights (if available)
  confidence_threshold: 0.45     # Detection confidence threshold
  iou_threshold: 0.5             # NMS IoU threshold
  frame_sample_rate: 10          # Sample every Nth RGB frame for damage detection
  classes:
    - "crack"
    - "water_stain"
    - "mold"
    - "peeling_paint"
    - "structural_damage"
    - "efflorescence"

# ─── Concealed Damage Rules ───────────────────────────────────────────────────
concealed_damage_rules:
  # Each rule: { trigger_class, proximity_meters, flag_class, explanation }
  - trigger_class: "water_stain"
    proximity_meters: 0.5
    flag_class: "possible_leak_behind_wall"
    explanation: "Water stain detected near plumbing route"
  - trigger_class: "mold"
    proximity_meters: 1.0
    flag_class: "moisture_ingress_suspected"
    explanation: "Mold colony suggests chronic moisture — check cavity wall"
  - trigger_class: "efflorescence"
    proximity_meters: 0.3
    flag_class: "structural_moisture"
    explanation: "Salt crystallisation indicates water moving through masonry"

# ─── Confidence Intervals ─────────────────────────────────────────────────────
confidence:
  lidar_wall_length_pct: 1.0    # ± % error for LiDAR tier wall lengths
  video_wall_length_pct: 3.0    # ± % error for video tier
  photo_wall_length_pct: 8.0    # ± % error for photo tier
  ceiling_height_cm: 1.5        # ± cm for ceiling height (all tiers)
  opening_width_cm: 2.0         # ± cm for openings (all tiers)

# ─── Output ───────────────────────────────────────────────────────────────────
output:
  base_dir: "./outputs"
  render_dpi: 150
  render_scale_px_per_meter: 100   # 100 px = 1 metre in rendered plan
  render_wall_color: [30, 30, 30]  # RGB
  render_floor_color: [245, 240, 230]
  render_opening_color: [100, 180, 255]
  render_damage_color: [220, 60, 60]

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level: "INFO"                  # DEBUG | INFO | WARNING | ERROR
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{line} | {message}"
  log_dir: "./logs"
  rotation: "10 MB"
